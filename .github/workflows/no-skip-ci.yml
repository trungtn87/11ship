name: No skip-ci markers

# Read-only guard for pull requests. Plain `pull_request` (the privileged variant is deliberately not used), so PR code never
# runs with a write token; the token below can only read. PR title and body reach the script as
# environment variables (data), never interpolated into a shell command.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  no-skip-ci:
    name: PR title, body and commits carry no CI-skip marker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Unit tests
        run: node --test tests/ci/no-skip-ci.test.mjs
      - name: Reject skip-ci markers
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-no-skip-ci.mjs
