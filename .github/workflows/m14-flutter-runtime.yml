name: M14 Flutter integration
on:
  push:
    branches: ['codex/m14-gps-test']
    paths: ['mobile/packages/n11_m14/**', 'mobile/ship/integration_test/m14_test.dart', '.github/workflows/m14-flutter-runtime.yml']
  workflow_dispatch:
concurrency:
  group: m14-flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          cd mobile/ship
          flutter pub get
          DEVICE_ENVIRONMENT=m14-integration ../tool/prepare-android.sh ship
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd mobile/ship && flutter test integration_test/m14_test.dart --reporter expanded
            adb shell "run-as vn.eleven.ship.test sh -c 'test ! -f databases/m14-history.db'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M14-Flutter-debug-runtime
          path: mobile/ship/build/app/outputs/apk/debug/*.apk
