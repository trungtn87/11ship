name: Mobile APK

# Builds the two Android test APKs (11Food-test.apk, 11Ship-test.apk). Run it by hand from the Actions tab
# ("Run workflow") or it runs on pull requests that touch mobile/ or the brand assets.
#
# Signing (Owner decision 2026-10-12, mobile/README.md "update in place"): the persistent test key comes from the GitHub Secrets
# ANDROID_TEST_KEYSTORE_BASE64, ANDROID_TEST_KEYSTORE_PASSWORD, ANDROID_TEST_KEY_ALIAS and ANDROID_TEST_KEY_PASSWORD (create them
# once with mobile/tool/create-test-keystore.sh). All four are required, there is NO fallback: when any is missing the job fails at
# its first step (before checkout), naming the missing secret(s); nothing is built, signed or uploaded. No throw-away key is ever generated.
#
# versionCode = github.run_number (the existing sequence, never reset). A re-run of the same run keeps the same number: it is the
# same build, not a new version.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server origin the APKs talk to (https only). Empty = config/endpoints.json (the VPS).'
        required: false
        default: ''
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
      - 'config/endpoints.json'
      - 'apps/backend/src/ops/app-compatibility.json'
      - 'tools/brand/**'
      - 'docs/brand/**'

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

# API_BASE_URL and DEVICE_ENVIRONMENT come from config/endpoints.json (the ONE place the server address is written; the step
# "Central endpoints" below exports them). A one-off build against another server passes api_base_url (workflow_dispatch).
# DEVICE_ENVIRONMENT is the non-secret identifier signed into every device proof; the server pins the same value
# (CLIENT_DEVICE_ENVIRONMENT). It is NOT changed with the environment name: a change would invalidate existing device bindings.

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: ${{ matrix.label }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: food
            label: 11Food
            app_id: vn.eleven.food.test
            server: FOOD
          - app: ship
            label: 11Ship
            app_id: vn.eleven.ship.test
            server: SHIP
    env:
      ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
      ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
      ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
      ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require the persistent signing secrets
        run: |
          missing=""
          for name in ANDROID_TEST_KEYSTORE_BASE64 ANDROID_TEST_KEYSTORE_PASSWORD ANDROID_TEST_KEY_ALIAS ANDROID_TEST_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            msg="Missing GitHub Secret(s):$missing. The APK is not built, signed or uploaded, and no temporary key is used. Run mobile/tool/create-test-keystore.sh once, store its four values as repository Secrets (keep a private backup of the key), then re-run."
            echo "::error title=signing secrets missing::$msg"
            echo "### ${{ matrix.label }}: APK not built" >> "$GITHUB_STEP_SUMMARY"
            echo "- $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          # A pull request would otherwise build the merge commit, not the commit the report names.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Source matches SOURCE_SHA
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$SOURCE_SHA" ]; then
            echo "::error title=source mismatch::checked out $actual but the build is labelled $SOURCE_SHA"; exit 1
          fi

      - name: Central endpoints (config/endpoints.json)
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          VAR_DEVICE_ENVIRONMENT: ${{ vars.N11_DEVICE_ENVIRONMENT }}
        run: |
          set -euo pipefail
          api="${INPUT_API_BASE_URL:-$(jq -er .api_origin config/endpoints.json)}"
          device="${VAR_DEVICE_ENVIRONMENT:-$(jq -er .device_environment config/endpoints.json)}"
          echo "API_BASE_URL=$api" >> "$GITHUB_ENV"
          echo "DEVICE_ENVIRONMENT=$device" >> "$GITHUB_ENV"

      - name: Server origin is a plain https origin
        run: |
          if ! printf '%s' "$API_BASE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$'; then
            echo "::error title=API_BASE_URL::must be a plain https origin (no path, query or credentials)"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: |
          for d in mobile/packages/n11_shared mobile/${{ matrix.app }}; do
            (cd "$d" && flutter pub get) 2>&1 | tee "$RUNNER_TEMP/pub.log" || {
              echo "::error title=pub get failed in $d::$(head -c 1400 "$RUNNER_TEMP/pub.log" | tr '\n' ' ')"; exit 1; }
          done

      - name: Analyze
        run: |
          for d in mobile/packages/n11_shared mobile/${{ matrix.app }}; do
            (cd "$d" && flutter analyze) 2>&1 | tee "$RUNNER_TEMP/an.log" || {
              echo "::error title=analyze failed in $d::$(grep -E '(error|warning|info) •' "$RUNNER_TEMP/an.log" | head -12 | tr '\n' '|' | head -c 1500)"; exit 1; }
          done

      - name: Test
        env:
          N11_V4_SCREENSHOTS: ${{ runner.temp }}/v4-foundation-ui
          N11_SHIP_V4_SCREENSHOTS: ${{ runner.temp }}/ship-v4-ui
        run: |
          dirs="mobile/${{ matrix.app }}"
          if [ "${{ matrix.app }}" = "food" ]; then dirs="mobile/packages/n11_shared $dirs"; fi
          for d in $dirs; do
            (cd "$d" && flutter test --reporter expanded) 2>&1 | tee "$RUNNER_TEMP/t.log" || {
              echo "::error title=tests failed in $d::$(grep -E -A1 'Which:|\[E\]' "$RUNNER_TEMP/t.log" | head -24 | tr '\n' '|' | head -c 4000)"; exit 1; }
          done

      - name: Upload V4 foundation widget renders (fixture data, not device acceptance)
        if: always() && matrix.app == 'food'
        uses: actions/upload-artifact@v4
        with:
          name: v4-foundation-ui-widget-renders
          path: ${{ runner.temp }}/v4-foundation-ui/*.png
          if-no-files-found: ignore

      - name: Upload 11Ship V4 widget renders (fixture data, not device acceptance)
        if: always() && matrix.app == 'ship'
        uses: actions/upload-artifact@v4
        with:
          name: 11Ship-v4-ui-widget-renders
          path: ${{ runner.temp }}/ship-v4-ui/*.png
          if-no-files-found: ignore

      - name: 11Ship home with offline map enabled
        if: matrix.app == 'ship'
        working-directory: mobile/ship
        run: flutter test test/home_map_test.dart --dart-define=M14_OFFLINE_MAP=true --reporter expanded

      - name: Render 11Ship M01 UI for review
        if: matrix.app == 'ship'
        working-directory: mobile/ship
        env:
          N11_SCREENSHOTS: ${{ runner.temp }}/ship-m01-ui
        run: flutter test test/screenshots_test.dart --reporter expanded

      - name: Upload 11Ship M01 widget renders (fixture data, not device acceptance)
        if: always() && matrix.app == 'ship'
        uses: actions/upload-artifact@v4
        with:
          name: 11Ship-m01-ui-widget-renders
          path: ${{ runner.temp }}/ship-m01-ui/*.png
          if-no-files-found: ignore

      # #194: home alert and location label in every state (GPS off, Internet down, server down, old position, resting). Widget renders of scripted state, not a device.
      - name: Render 11Ship home GPS/network alerts for review
        if: matrix.app == 'ship'
        working-directory: mobile/ship
        env:
          N11_SCREENSHOTS: ${{ runner.temp }}/ship-home-alerts
        run: flutter test test/home_alert_screenshots_test.dart --reporter expanded

      - name: Upload 11Ship home alert renders (scripted state, not device acceptance)
        if: always() && matrix.app == 'ship'
        uses: actions/upload-artifact@v4
        with:
          name: 11Ship-home-alert-widget-renders
          path: ${{ runner.temp }}/ship-home-alerts/*.png
          if-no-files-found: ignore

      - name: Render 11Food V4 discovery, menu and forms for review
        if: matrix.app == 'food'
        working-directory: mobile/food
        env:
          N11_SCREENSHOTS: ${{ runner.temp }}/food-v4-ui
        run: flutter test test/m02_screenshots_test.dart test/screenshots_test.dart --reporter expanded

      - name: Upload 11Food V4 widget renders (fixture data, not device acceptance)
        if: always() && matrix.app == 'food'
        uses: actions/upload-artifact@v4
        with:
          name: 11Food-v4-ui-widget-renders
          path: ${{ runner.temp }}/food-v4-ui/*.png
          if-no-files-found: ignore

      - name: Render 11Food M10 order screens for review
        if: matrix.app == 'food'
        working-directory: mobile/food
        env:
          N11_SCREENSHOTS: ${{ runner.temp }}/food-m10-ui
        run: flutter test test/m10_screenshots_test.dart --reporter expanded

      - name: Upload 11Food M10 widget renders (sample data, not device acceptance)
        if: always() && matrix.app == 'food'
        uses: actions/upload-artifact@v4
        with:
          name: 11Food-m10-ui-widget-renders
          path: ${{ runner.temp }}/food-m10-ui/*.png
          if-no-files-found: ignore

      - name: Render 11Food setup checklist, quick contact and road distance for review (issue 190)
        if: matrix.app == 'food'
        working-directory: mobile/food
        env:
          N11_SCREENSHOTS: ${{ runner.temp }}/food-issue190-ui
        run: flutter test test/issue190_screenshots_test.dart --reporter expanded

      - name: Upload 11Food issue 190 widget renders (fixture data, not device acceptance)
        if: always() && matrix.app == 'food'
        uses: actions/upload-artifact@v4
        with:
          name: 11Food-issue190-ui-widget-renders
          path: ${{ runner.temp }}/food-issue190-ui/*.png
          if-no-files-found: ignore

      - name: M14 map-only package contracts
        working-directory: mobile/packages/n11_m14_map
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: M14 Flutter bridge contracts
        if: matrix.app == 'ship'
        working-directory: mobile/packages/n11_m14
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # M08 push: the Firebase Android client identifiers of THIS app (repository variables FCM_PROJECT_ID, FCM_SENDER_ID, FCM_SHIP_APP_ID / FCM_FOOD_APP_ID and
      # secrets FCM_SHIP_API_KEY / FCM_FOOD_API_KEY). All four present = the APK carries FCM; none = a build without push (the app says so); a partial or invalid
      # set stops the build. The server's credential (service account) is never here.
      - name: Prepare Android project
        env:
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
          FCM_APP_ID: ${{ matrix.app == 'ship' && vars.FCM_SHIP_APP_ID || vars.FCM_FOOD_APP_ID }}
          FCM_API_KEY: ${{ matrix.app == 'ship' && secrets.FCM_SHIP_API_KEY || secrets.FCM_FOOD_API_KEY }}
        run: |
          DEVICE_ENVIRONMENT="$DEVICE_ENVIRONMENT" mobile/tool/prepare-android.sh ${{ matrix.app }} | tee "$RUNNER_TEMP/prepare.log"
          if grep -q 'push=off' "$RUNNER_TEMP/prepare.log"; then
            echo "::warning title=M08 push not in this APK::the Firebase client identifiers are not configured for ${{ matrix.app }}; the app is built without push (inbox and live sync still work)"
          fi

      - name: Native unit tests (Binder join rules)
        run: |
          cd mobile/${{ matrix.app }}/android
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-test.log" || {
            echo "::error title=native unit tests failed::$(grep -E 'FAILED|error:|e: ' "$RUNNER_TEMP/gradle-test.log" | head -12 | tr '\n' '|' | head -c 2500)"; exit 1; }

      # 11Ship's location service sends the position itself (it keeps going with the screen locked or the app swiped away): the JVM rules of the uploader run here.
      - name: Location uploader unit tests (11Ship)
        if: matrix.app == 'ship'
        run: |
          cd mobile/gps-test
          ./gradlew --no-daemon :gps:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/uploader-test.log" || {
            echo "::error title=uploader unit tests failed::$(grep -E 'FAILED|error:|e: ' "$RUNNER_TEMP/uploader-test.log" | head -12 | tr '\n' '|' | head -c 2500)"; exit 1; }

      # The map flag is set only when the Cao Bang package is really in the tree and every file it lists matches its recorded SHA-256, so an APK never
      # turns the map on without the asset. Both apps enable the offline map when the package is complete; GPS is independent.
      - name: M14 map flag
        id: m14
        run: |
          set -euo pipefail
          flag=false
            if python3 - <<'PYCODE'
          import hashlib, json, os, sys
          root = 'mobile/gps-test/app/src/main/assets/caobang'
          try:
              manifest = json.load(open(os.path.join(root, 'manifest.json')))
              files = manifest['sha256']
              for name in ('map.geojson', 'style.json'):
                  assert name in files, name + ' missing checksum'
                  assert os.path.isfile(os.path.join(root, name)), name + ' missing'
              for name, digest in files.items():
                  path = os.path.join(root, name)
                  assert os.path.isfile(path), name + ' missing'
                  assert hashlib.sha256(open(path, 'rb').read()).hexdigest() == digest, name + ' differs from the manifest'
          except Exception as error:
              print('::warning title=M14 map not enabled::' + str(error))
              sys.exit(1)
          PYCODE
            then flag=true; else echo "::warning title=M14 map off for ${{ matrix.app }}::the Cao Bang package is missing or does not match its manifest; the app is built without the map"; fi
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "M14_OFFLINE_MAP for ${{ matrix.app }}: $flag"

      - name: Build release APK
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' mobile/${{ matrix.app }}/pubspec.yaml)"
          cd mobile/${{ matrix.app }}
          fv="$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])' 2>/dev/null)" || fv=unknown
          flutter build apk --release \
            --build-name="$version" --build-number="${{ github.run_number }}" \
            --dart-define=M14_OFFLINE_MAP="${{ steps.m14.outputs.flag }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ID="${{ matrix.app_id }}" \
            --dart-define=APP_VERSION="$version" \
            --dart-define=BUILD_NUMBER="${{ github.run_number }}" \
            --dart-define=CI_RUN="${{ github.run_id }}" \
            --dart-define=SOURCE_SHA="$SOURCE_SHA" \
            --dart-define=BUILT_AT="$(date -u +%Y-%m-%dT%H:%MZ)" \
            --dart-define=SIGNING_MODE="stable" \
            --dart-define=DEVICE_ENVIRONMENT="$DEVICE_ENVIRONMENT" \
            --dart-define=BUILD_FLUTTER="$fv" 2>&1 | tee "$RUNNER_TEMP/b.log" || {
              echo "::error title=build failed::$(tail -n 25 "$RUNNER_TEMP/b.log" | cut -c1-220 | tr '\n' '|' | head -c 2500)"; exit 1; }

      # Exact permission allowlist of the compiled (still unsigned) APK: needs no secret, so it runs for every build.
      # The manifest names the service, so this holds even when R8 renames the classes behind it.
      - name: 11Ship declares the location service; 11Food does not
        run: |
          bt="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/manifest-service.txt"
          if [ "${{ matrix.app }}" = ship ]; then
            grep -q 'vn.eleven.m14.flutter.ShipLocationService' "$RUNNER_TEMP/manifest-service.txt" || { echo "::error::11Ship manifest does not declare ShipLocationService"; exit 1; }
          else
            if grep -q 'ShipLocationService' "$RUNNER_TEMP/manifest-service.txt"; then echo "::error::the location service leaked into 11Food"; exit 1; fi
          fi

      - name: Permission allowlist
        run: |
          bt="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt2" dump badging mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/unsigned-badging.txt"
          mobile/tool/check-apk-permissions.sh ${{ matrix.app }} "$RUNNER_TEMP/unsigned-badging.txt"

      # 11Food carries the map only: no recorder, no foreground-service permission (the allowlist above already refuses it), no routing client. The size
      # the map adds is the Cao Bang package plus the MapLibre native libraries; both are measured on the built APK and printed in the job summary.
      - name: 11Food is map-only and the map size is measured
        if: matrix.app == 'food'
        run: |
          python3 - <<'PYCODE'
          import os, zipfile
          path = 'mobile/food/build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(path) as apk:
              dex = b''.join(apk.read(n) for n in apk.namelist() if n.endswith('.dex'))
              assert b'Lvn/eleven/m14/gps/RecorderService;' not in dex, 'the GPS recorder leaked into 11Food'
              assert b'Lvn/eleven/m14/routing/' not in dex, 'the routing client leaked into 11Food'
              assert b'Lvn/eleven/m14/history/' not in dex, 'test history leaked into 11Food'
              names = apk.namelist()
              flag = '${{ steps.m14.outputs.flag }}' == 'true'
              if flag:
                  assert 'assets/caobang/manifest.json' in names, 'the map is on but the Cao Bang package is not in the APK'
              assets = sum(i.compress_size for i in apk.infolist() if i.filename.startswith('assets/caobang/'))
              native = sum(i.compress_size for i in apk.infolist() if i.filename.startswith('lib/') and 'maplibre' in i.filename.lower())
              total = os.path.getsize(path)
          line = f'11Food map size: APK {total} B; Cao Bang package {assets} B; MapLibre native libs {native} B; map adds about {assets + native} B (compressed)'
          print(line)
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('- ' + line + '\n')
          PYCODE

      - name: Official M14 excludes test history
        if: matrix.app == 'ship'
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, zipfile
          with zipfile.ZipFile('mobile/ship/build/app/outputs/flutter-apk/app-release.apk') as apk:
              dex = b''.join(apk.read(n) for n in apk.namelist() if n.endswith('.dex'))
              assert b'Lvn/eleven/m14/history/' not in dex, 'Test history leaked into official Ship'
              assert 'assets/caobang/manifest.json' in apk.namelist()
              manifest = json.loads(apk.read('assets/caobang/manifest.json'))
              for name, digest in manifest['sha256'].items():
                  assert hashlib.sha256(apk.read('assets/caobang/' + name)).hexdigest() == digest, name
              assert '${{ steps.m14.outputs.flag }}' == 'true', 'Ship must enable the verified offline package'
              print('11Ship APK: offline map enabled; every Cao Bang asset checksum verified')
          PYCODE

      - name: Sign and verify
        run: |
          set -euo pipefail
          trap 'echo "::error title=sign failed::line $LINENO: $BASH_COMMAND"' ERR
          bt="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          work="$RUNNER_TEMP/sign"; mkdir -p "$work"
          chmod 700 "$work"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 -d > "$work/test.jks"
          src="mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk"
          out="${{ matrix.label }}-test.apk"
          if [ ! -f "$src" ]; then
            echo "::error title=apk not found::$(find . -name '*.apk' -not -path './.git/*' 2>/dev/null | head -8 | tr '\n' '|')"
            exit 1
          fi
          cp "$src" "$work/unsigned.apk"
          zip -q -d "$work/unsigned.apk" 'META-INF/*' || true
          "$bt/zipalign" -f -p 4 "$work/unsigned.apk" "$work/aligned.apk"
          "$bt/apksigner" sign --ks "$work/test.jks" --ks-key-alias "$ANDROID_TEST_KEY_ALIAS" \
            --ks-pass env:ANDROID_TEST_KEYSTORE_PASSWORD --key-pass env:ANDROID_TEST_KEY_PASSWORD \
            --out "$out" "$work/aligned.apk"
          "$bt/apksigner" verify --verbose --print-certs "$out" > "$work/verify.txt"
          head -3 "$work/verify.txt"

          # What the APK says it is: applicationId and versionCode are checked, not assumed.
          "$bt/aapt2" dump badging "$out" > "$work/badging.txt"
          grep -E "^package: |application-label:|uses-permission" "$work/badging.txt"
          grep -q "package: name='${{ matrix.app_id }}'" "$work/badging.txt" || { echo "::error title=applicationId changed::expected ${{ matrix.app_id }}"; exit 1; }
          grep -q "versionCode='${{ github.run_number }}'" "$work/badging.txt" || { echo "::error title=versionCode mismatch::expected ${{ github.run_number }}"; exit 1; }
          mobile/tool/check-apk-permissions.sh ${{ matrix.app }} "$work/badging.txt"

          # The signing certificate: the APK's one must be the keystore's one (same persistent key). Only public fingerprints are printed.
          # apksigner words this line differently per signature scheme ("Signer #1 certificate ..." / "Signer (minSdkVersion=N, ...)
          # certificate ..."), so the label is not parsed: the 64-hex digest is taken from any digest line. Every signer line must carry
          # the same digest, and that digest must be the keystore certificate's.
          apk_fp="$(grep -i 'certificate SHA-256 digest' "$work/verify.txt" | tr 'A-F' 'a-f' | tr -d ':' | grep -oE '[0-9a-f]{64}' | sort -u || true)"
          key_fp="$(keytool -exportcert -keystore "$work/test.jks" -alias "$ANDROID_TEST_KEY_ALIAS" -storepass:env ANDROID_TEST_KEYSTORE_PASSWORD 2>/dev/null | sha256sum | cut -d' ' -f1)"
          if [ -z "$apk_fp" ] || [ "$apk_fp" != "$key_fp" ]; then
            # Public values only (certificate fingerprints and apksigner's own labels), to tell "no digest line found" from "different key".
            echo "apksigner digest lines: $(grep -c 'certificate SHA-256 digest' "$work/verify.txt"); APK fingerprint(s): ${apk_fp:-none}; keystore fingerprint: $key_fp"
            grep -i 'certificate SHA-256 digest' "$work/verify.txt" | cat -A | cut -c1-200
            echo "::error title=signer mismatch::the APK is not signed with the persistent test key"; exit 1
          fi
          rm -f "$work/test.jks"
          sha256sum "$out"
          printf '{"app":"%s","package_name":"%s","signer_sha256":"%s","version_code":%s,"source_sha":"%s"}\n' \
            "${{ matrix.server }}" "${{ matrix.app_id }}" "$apk_fp" "${{ github.run_number }}" "$SOURCE_SHA" > "signer-${{ matrix.app }}.json"
          {
            echo "### ${{ matrix.label }}-test.apk"
            echo "- applicationId: \`${{ matrix.app_id }}\`, versionCode ${{ github.run_number }} (run attempt ${{ github.run_attempt }}; a re-run of this run is the same build, not a new version), source \`$SOURCE_SHA\`"
            echo "- Signed with the persistent test key from GitHub Secrets: it updates over older builds and keeps their data."
            echo "- Public signing certificate SHA-256 (for CLIENT_DEVICE_ALLOWED_SIGNERS_FILE): \`$apk_fp\`"
            echo "- API_BASE_URL \`$API_BASE_URL\`, device environment \`$DEVICE_ENVIRONMENT\`"
            echo "- apk sha256: \`$(sha256sum "$out" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-test.apk
          path: ${{ matrix.label }}-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload public signer fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: signer-${{ matrix.app }}
          path: signer-${{ matrix.app }}.json
          if-no-files-found: error
          retention-days: 30

  # M08: the push build path (FCM client library, N11PushChannel, N11FirebaseService, notification icon) is only compiled when the build is given real Firebase
  # identifiers, which a CI without them never does. This job compiles it with DUMMY, non-secret identifiers so that a broken push build is found here and not
  # when the Owner finally supplies the real values. It proves the build, the manifest and the permission allowlist; it uploads nothing and proves no delivery.
  push-compile:
    name: ${{ matrix.label }} push build compiles
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: food
            label: 11Food
          - app: ship
            label: 11Ship
    env:
      DEVICE_ENVIRONMENT: ci-push-compile
      FCM_PROJECT_ID: n11-ci-compile
      FCM_SENDER_ID: '123456789012'
      FCM_APP_ID: '1:123456789012:android:0123456789abcdef'
      FCM_API_KEY: AIzaSyN11CiCompileOnlyDummy0000000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          for d in mobile/packages/n11_shared mobile/${{ matrix.app }}; do (cd "$d" && flutter pub get); done
      - name: Prepare Android project with push (dummy identifiers)
        run: mobile/tool/prepare-android.sh ${{ matrix.app }} | tee "$RUNNER_TEMP/prepare.log" && grep -q 'push=on' "$RUNNER_TEMP/prepare.log"
      - name: Compile the push build
        run: |
          cd mobile/${{ matrix.app }}
          flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid --dart-define=APP_ID=ci --dart-define=DEVICE_ENVIRONMENT="$DEVICE_ENVIRONMENT" 2>&1 | tee "$RUNNER_TEMP/b.log" || {
            echo "::error title=push build failed::$(grep -E 'error:|e: |FAILED|What went wrong' -A2 "$RUNNER_TEMP/b.log" | head -20 | cut -c1-220 | tr '\n' '|' | head -c 2500)"; exit 1; }
      - name: Manifest carries the push service and the notification permission; allowlist holds
        run: |
          bt="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          apk=mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          "$bt/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          mobile/tool/check-apk-permissions.sh ${{ matrix.app }} "$RUNNER_TEMP/badging.txt"
          grep -q "android.permission.POST_NOTIFICATIONS" "$RUNNER_TEMP/badging.txt"
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/manifest.txt"
          grep -q "vn.eleven.n11.N11FirebaseService" "$RUNNER_TEMP/manifest.txt"
          grep -q "com.google.firebase.MESSAGING_EVENT" "$RUNNER_TEMP/manifest.txt"
          grep -q "vn.eleven.n11.N11Application" "$RUNNER_TEMP/manifest.txt"

  # The two public fingerprints as the file the server pins (CLIENT_DEVICE_ALLOWED_SIGNERS_FILE). It holds no secret.
  signers:
    name: Public signer allowlist
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signer-*
          path: signers
          merge-multiple: true
      - name: Build android-signers.json
        run: |
          python3 - <<'PY'
          import json
          food = json.load(open('signers/signer-food.json'))
          ship = json.load(open('signers/signer-ship.json'))
          assert food['signer_sha256'] == ship['signer_sha256'], 'the two apps must share one persistent signer'
          out = {
            'FOOD': {'package_name': food['package_name'], 'signer_sha256': food['signer_sha256']},
            'SHIP': {'package_name': ship['package_name'], 'signer_sha256': ship['signer_sha256']},
          }
          json.dump(out, open('android-signers.json', 'w'), indent=2)
          print(json.dumps(out, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-signers.json
          path: android-signers.json
          if-no-files-found: error
          retention-days: 30

  ship-android-ui:
    name: 11Ship Android guest UI and screenshots
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: 11Ship-test.apk
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture signed APK guest screens without sending SMS
        env:
          SHIP_UI_OUTPUT: ${{ runner.temp }}/ship-android-ui
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 mobile/tool/ship-android-ui-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 11Ship-android-ui-screenshots
          path: ${{ runner.temp }}/ship-android-ui/
          if-no-files-found: warn
          retention-days: 30

  food-android-ui:
    name: 11Food Android live home and screenshot
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: 11Food-test.apk
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture signed APK discovery home without sending SMS
        env:
          FOOD_UI_OUTPUT: ${{ runner.temp }}/food-android-ui
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 mobile/tool/food-android-ui-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 11Food-android-ui-screenshots
          path: ${{ runner.temp }}/food-android-ui/
          if-no-files-found: warn
          retention-days: 30
