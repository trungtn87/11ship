name: One-click deploy contracts
on:
  pull_request:
    paths:
      - 'deploy-11ship.ps1'
      - 'scripts/deploy/**'
      - 'tests/oneclick/**'
      - '.github/workflows/oneclick-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'deploy-11ship.ps1'
      - 'scripts/deploy/**'
      - 'tests/oneclick/**'
      - '.github/workflows/oneclick-deploy.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bash -n scripts/deploy/deploy-vps.sh
      - run: node --test tests/oneclick/*.test.mjs
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parser and offline deployment contracts
        shell: ${{ matrix.shell }}
        run: .\tests\oneclick\windows.ps1
