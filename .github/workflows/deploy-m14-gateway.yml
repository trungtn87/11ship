name: Deploy M14 Gateway

# Upgrades (or inspects) ONLY the M14 routing gateway on the VPS. Run it BEFORE "Deploy VPS" when that run stops with
# "gateway routeVersion is missing or malformed" (the gateway is older than the backend). It never changes the backend,
# its env file or its service, and ops/m14/gateway-gate.sh is not weakened: the gateway must really report ready + routeVersion.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = read-only report of the gateway; upgrade = build the image on the runner, load it on the VPS, start it, smoke test, then run the gateway gate'
        type: choice
        options: [inspect, upgrade]
        default: inspect

permissions:
  contents: read

concurrency:
  group: vps-production-deploy
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI gate (deploy SHA must be green on main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve latest main once
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful CI on the exact deploy SHA (fail-closed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/deploy/ci-gate.mjs "$DEPLOY_SHA"

  gateway:
    needs: ci-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: vps-production
      url: https://103.9.78.67.sslip.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
      - name: Resolve SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Gateway ${{ inputs.mode }}
        env:
          M14_MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy/github-vps-m14-gateway.sh
