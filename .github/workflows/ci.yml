name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 24, PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.11
        env:
          # Admin account of this throwaway service container. The application and the tests
          # never use it; they use the restricted ship11_test role created below.
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_ephemeral_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm from packageManager
        run: npm install --global npm@11.9.0

      - name: Verify toolchain versions
        run: |
          expected_node="$(tr -d '[:space:]' < .node-version)"
          actual_node="$(node -p 'process.versions.node')"
          actual_npm="$(npm -v)"
          echo "node ${actual_node} (expected ${expected_node}), npm $(npm -v)"
          test "${actual_node}" = "${expected_node}"
          test "${actual_npm}" = "11.9.0"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lockfile must be unchanged by npm ci
        run: git diff --exit-code -- package-lock.json

      # Lint, typecheck and build also write their output to a file. When one of them fails, the tail
      # of that output becomes an annotation (the job log itself cannot always be downloaded).
      - name: Lint
        id: lint
        shell: bash
        run: |
          mkdir -p .test-results
          npm run lint 2>&1 | tee .test-results/lint.log

      - name: Annotate lint failure
        if: ${{ failure() && steps.lint.conclusion == 'failure' }}
        run: node scripts/annotate-log.js Lint .test-results/lint.log

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          mkdir -p .test-results
          npm run typecheck 2>&1 | tee .test-results/typecheck.log

      - name: Annotate typecheck failure
        if: ${{ failure() && steps.typecheck.conclusion == 'failure' }}
        run: node scripts/annotate-log.js Typecheck .test-results/typecheck.log 60

      - name: Build
        id: build
        shell: bash
        run: |
          mkdir -p .test-results
          npm run build 2>&1 | tee .test-results/build.log

      - name: Annotate build failure
        if: ${{ failure() && steps.build.conclusion == 'failure' }}
        run: node scripts/annotate-log.js Build .test-results/build.log 60

      # M01.22: the read-only test SMS inbox reader against the compiled backend (real private state, real listener).
      - name: Test SMS inbox tool (compiled backend, real listener and private state)
        id: testsms
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .test-results
          npm run test-sms:test 2>&1 | tee .test-results/test-sms.log

      - name: Annotate test SMS inbox tool failure
        if: ${{ failure() && steps.testsms.conclusion == 'failure' }}
        run: node scripts/annotate-log.js "Test SMS inbox tool" .test-results/test-sms.log 60

      - name: Report test SMS inbox tool counts
        if: ${{ always() && hashFiles('.test-results/test-sms.log') != '' }}
        shell: bash
        run: echo "::notice title=Test SMS inbox tool (Linux)::$(grep -E 'ℹ (tests|suites|pass|fail|cancelled|skipped|todo)|✖|SKIP' .test-results/test-sms.log | tr '\n' ';')"

      # M00-D1: render.yaml stays inside the authorized scope and the remote migration command keeps its gates.
      # Pure Node, no database. This is a structural check; Render's own Blueprint validation is a separate step.
      - name: Deploy configuration tests (Render Blueprint, remote migration gates)
        run: npm run deploy:test

      # M01-UI: shared phone UI foundation (validation, route guards, ports never answering ok, design preview isolation).
      - name: Client shell tests (phone UI foundation)
        run: npm run client-shell:test

      # M01-UI: web administration menu by permission, "Sắp có" entries, real build free of preview data, read-only preview.
      - name: Admin web UI tests (menu, permissions, preview isolation)
        run: npm run admin-web:test

      # M00-L: structure checks plus the launcher behaviour suite under PowerShell 7 (real git, faked Docker/npm).
      # The Windows-only parts (cmd wrappers, double-click) run in the launcher-windows job below.
      - name: Local launcher tests (behaviour suite under PowerShell 7)
        id: launcher
        run: npm run launcher:test

      - name: Annotate launcher test failure
        if: ${{ failure() && steps.launcher.conclusion == 'failure' }}
        run: node scripts/annotate-log.js "Launcher behaviour (PowerShell 7)" .test-results/launcher-behaviour.log 60

      - name: Report launcher behaviour counts
        if: ${{ always() && hashFiles('.test-results/launcher-behaviour.log') != '' }}
        shell: bash
        run: echo "::notice title=Launcher behaviour (PowerShell 7)::$(grep -E '^(POWERSHELL|SUMMARY|SKIP)' .test-results/launcher-behaviour.log | tr '\n' ';')"

      - name: Create restricted test role, database and wrong-user fixture
        # PGPASSWORD (the service admin password) exists only in this step. The tests never see it.
        env:
          PGPASSWORD: ci_admin_ephemeral_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_admin -d postgres <<'SQL'
          CREATE ROLE ship11_test LOGIN PASSWORD 'ci_test_ephemeral_only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE ship11_test OWNER ship11_test;
          -- Negative fixture for F06: a real, restricted server login that can reach ship11_test
          -- but is not the allowed user. Used only through TEST_WRONG_USER_DATABASE_URL.
          CREATE ROLE ship11_wrong_user LOGIN PASSWORD 'ci_wrong_user_ephemeral_only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
          # M00-D1 fixture for the remote migration path test (a disposable database on this throwaway container; never
          # Supabase). Mirrors ops/runbooks/render-supabase-staging.md section 3: two NON-superuser roles, the admin
          # creates schema app AUTHORIZATION the migrator, and the runtime role only gets USAGE on it.
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_admin -d postgres <<'SQL'
          CREATE ROLE ship11_remote_migrator LOGIN PASSWORD 'ci_remote_migrator_ephemeral_only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE ship11_remote_app LOGIN PASSWORD 'ci_remote_app_ephemeral_only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE ship11_remote_path_test;
          REVOKE ALL ON DATABASE ship11_remote_path_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE ship11_remote_path_test TO ship11_remote_migrator, ship11_remote_app;
          -- Migration 1 runs CREATE SCHEMA IF NOT EXISTS app; PostgreSQL checks CREATE on the database even when the
          -- schema already exists, so the migrator needs it (found by this test; see the runbook).
          GRANT CREATE ON DATABASE ship11_remote_path_test TO ship11_remote_migrator;
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_admin -d ship11_remote_path_test <<'SQL'
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          CREATE SCHEMA app AUTHORIZATION ship11_remote_migrator;
          REVOKE ALL ON SCHEMA app FROM PUBLIC;
          GRANT USAGE ON SCHEMA app TO ship11_remote_app;
          SQL

      - name: Apply migrations (smoke)
        env:
          APP_ENV: test
          DATABASE_URL: postgres://ship11_test:ci_test_ephemeral_only@127.0.0.1:5432/ship11_test
        run: npm run db:migrate

      - name: Unit tests
        env:
          NODE_ENV: test
        shell: bash
        run: |
          mkdir -p .test-results
          npm run test:unit -- --json --outputFile=.test-results/unit.json 2>&1 | tee .test-results/unit.log

      - name: Report unit test counts
        if: ${{ always() && hashFiles('.test-results/unit.log') != '' }}
        run: node scripts/report-test-counts.js "Unit tests" .test-results/unit.json --log .test-results/unit.log --max-pending 0

      # Local mode: exactly what the README tells a developer to run. No CI admin credential and no
      # wrong-user fixture. Only the real wrong-user test may be skipped; nothing else.
      - name: Integration tests, local mode (no CI-only credentials)
        env:
          NODE_ENV: test
          APP_ENV: test
          DATABASE_URL: postgres://ship11_test:ci_test_ephemeral_only@127.0.0.1:5432/ship11_test
        shell: bash
        run: |
          test -z "${PGPASSWORD:-}" && test -z "${TEST_WRONG_USER_DATABASE_URL:-}" && test -z "${TEST_REMOTE_PATH_DATABASE_URL:-}"
          mkdir -p .test-results
          npm run test:integration -- --json --outputFile=.test-results/integration-local.json 2>&1 | tee .test-results/integration-local.log

      - name: Report integration counts, local mode
        if: ${{ always() && hashFiles('.test-results/integration-local.log') != '' }}
        run: |
          node scripts/report-test-counts.js "Integration (local mode)" .test-results/integration-local.json --log .test-results/integration-local.log \
            --max-pending 5 --expect "real PostgreSQL server user is outside the allowlist=pending" \
            --expect "applies every migration as the non-superuser migrator=pending"

      # CI mode: same suite plus the real wrong-user fixture. Nothing may be skipped.
      - name: Integration tests, CI mode (real wrong-user fixture)
        env:
          NODE_ENV: test
          APP_ENV: test
          DATABASE_URL: postgres://ship11_test:ci_test_ephemeral_only@127.0.0.1:5432/ship11_test
          TEST_WRONG_USER_DATABASE_URL: postgres://ship11_wrong_user:ci_wrong_user_ephemeral_only@127.0.0.1:5432/ship11_test
          TEST_REMOTE_PATH_DATABASE_URL: postgres://ship11_remote_migrator:ci_remote_migrator_ephemeral_only@127.0.0.1:5432/ship11_remote_path_test
          TEST_REMOTE_PATH_RUNTIME_URL: postgres://ship11_remote_app:ci_remote_app_ephemeral_only@127.0.0.1:5432/ship11_remote_path_test
        shell: bash
        run: |
          mkdir -p .test-results
          npm run test:integration -- --json --outputFile=.test-results/integration-ci.json 2>&1 | tee .test-results/integration-ci.log

      - name: Report integration counts, CI mode
        if: ${{ always() && hashFiles('.test-results/integration-ci.log') != '' }}
        run: |
          node scripts/report-test-counts.js "Integration (CI mode)" .test-results/integration-ci.json --log .test-results/integration-ci.log \
            --max-pending 0 --expect "real PostgreSQL server user is outside the allowlist=passed" \
            --expect "applies every migration as the non-superuser migrator=passed" \
            --expect "finds nothing to do on a second run=passed" \
            --expect "runbook per-table grants cover exactly the tables=passed"

  # M00-VPS-01 package A: the self-hosted staging path on a THROWAWAY PostgreSQL 17 with TLS. It builds the same private CA
  # and server certificate as ops/selfhosted/make-pki.sh (the certificate names only localhost), starts postgres:17.11 with
  # TLS 1.3 and an hba file that mirrors ops/selfhosted/pg_hba.conf (hostssl + SCRAM only), prepares roles, database and schema
  # with the runbook's own SQL, then runs the REAL operator commands against it (tests/selfhosted). Everything is generated
  # here and discarded with the runner: no repository secret, no real database, no Supabase.
  selfhosted-postgres:
    name: Self-hosted PostgreSQL 17 over TLS (M00-VPS-01)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm from packageManager
        run: npm install --global npm@11.9.0

      - name: Verify toolchain versions
        run: |
          expected_node="$(tr -d '[:space:]' < .node-version)"
          actual_node="$(node -p 'process.versions.node')"
          actual_npm="$(npm -v)"
          echo "node ${actual_node} (expected ${expected_node}), npm ${actual_npm}"
          test "${actual_node}" = "${expected_node}"
          test "${actual_npm}" = "11.9.0"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create the throwaway CA, certificates and a TLS-only PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          pki="${RUNNER_TEMP}/pki"
          conf="${RUNNER_TEMP}/pgconf"

          # The same script the runbook uses for the VPS.
          ./ops/selfhosted/make-pki.sh "${pki}"
          chmod 755 "${pki}"
          # Inside the container PostgreSQL runs as uid 999 and refuses a key it does not own.
          sudo chown 999:999 "${pki}/server.key"

          # Mirrors ops/selfhosted/pg_hba.conf. The only differences: the source address is "all" because a published Docker
          # port arrives from the bridge gateway, and the CI superuser may log in (over TLS) to prepare the fixture.
          mkdir -p "${conf}"
          cat > "${conf}/pg_hba.conf" <<'HBA'
          local      all              all                                     trust
          hostssl    all              postgres         all                    scram-sha-256
          hostssl    ship11_staging   ship11_app       all                    scram-sha-256
          hostssl    ship11_staging   ship11_migrator  all                    scram-sha-256
          host       all              all              all                    reject
          HBA
          chmod 755 "${conf}"
          chmod 644 "${conf}/pg_hba.conf"

          admin_pw="$(openssl rand -hex 16)"
          migrator_pw="$(openssl rand -hex 16)"
          app_pw="$(openssl rand -hex 16)"
          for value in "${admin_pw}" "${migrator_pw}" "${app_pw}"; do
            echo "::add-mask::${value}"
          done
          {
            echo "SELFHOSTED_ADMIN_PASSWORD=${admin_pw}"
            echo "SELFHOSTED_MIGRATOR_PASSWORD=${migrator_pw}"
            echo "SELFHOSTED_APP_PASSWORD=${app_pw}"
            echo "SELFHOSTED_PKI_DIR=${pki}"
          } >> "${GITHUB_ENV}"

          docker run -d --name pg17-selfhosted \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="${admin_pw}" \
            -v "${pki}:/pki:ro" -v "${conf}:/pgconf:ro" \
            postgres:17.11 \
            -c ssl=on -c ssl_cert_file=/pki/server.crt -c ssl_key_file=/pki/server.key \
            -c ssl_min_protocol_version=TLSv1.3 -c hba_file=/pgconf/pg_hba.conf \
            -c listen_addresses='*' -c password_encryption=scram-sha-256

          for _ in $(seq 1 60); do
            if docker exec pg17-selfhosted pg_isready -h localhost -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec pg17-selfhosted pg_isready -h localhost -U postgres

          # From here on every connection of this job is TLS with the chain AND the host name verified.
          export PGSSLROOTCERT="${pki}/ca.crt" PGPASSWORD="${admin_pw}"
          admin="host=localhost port=5432 dbname=postgres user=postgres sslmode=verify-full"
          psql "${admin}" -Atc "select 'PostgreSQL ' || current_setting('server_version') || ', ssl=' || current_setting('ssl') || ', min TLS ' || current_setting('ssl_min_protocol_version')"

          # The runbook's own SQL: roles, database ship11_staging, schema app owned by the migration role.
          psql "${admin}" -v ON_ERROR_STOP=1 -v migrator_password="${migrator_pw}" -v app_password="${app_pw}" \
            -f ops/selfhosted/01-roles-database.sql

      - name: Self-hosted staging end to end (real operator commands, PostgreSQL 17, TLS)
        id: selfhosted
        env:
          SELFHOSTED_E2E_CONFIRM: disposable-ci-database
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .test-results
          npm run selfhosted:test 2>&1 | tee .test-results/selfhosted.log

      - name: Annotate self-hosted failure
        if: ${{ failure() && steps.selfhosted.conclusion == 'failure' }}
        run: node scripts/annotate-log.js "Self-hosted PostgreSQL 17 over TLS" .test-results/selfhosted.log 60

      - name: Report self-hosted counts
        if: ${{ always() && hashFiles('.test-results/selfhosted.log') != '' }}
        shell: bash
        run: echo "::notice title=Self-hosted PostgreSQL 17 over TLS::$(grep -E 'ℹ (tests|suites|pass|fail|cancelled|skipped|todo)|✖|SKIP' .test-results/selfhosted.log | tr '\n' ';')"

      - name: PostgreSQL container log on failure
        if: ${{ failure() }}
        run: docker logs --tail 80 pg17-selfhosted || true

      - name: Remove the throwaway container
        if: ${{ always() }}
        run: docker rm -f pg17-selfhosted || true

  # M00-VPS-01 gói B: the release artifact for the Ubuntu 24.04 / VinaHost VPS. Built from the EXACT head commit of the pull
  # request (not the merge commit), verified the way the operator will use it, and uploaded with its checksum. No database,
  # no secret, no deployment: nothing here touches the VPS.
  ubuntu-artifact:
    name: Ubuntu/VinaHost artifact (M00-VPS-01)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm from packageManager
        run: npm install --global npm@11.9.0

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build the artifact
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "${sha}" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node scripts/deploy/build-ubuntu-artifact.mjs --out artifact-out --sha "${sha}" | tee artifact-out.log
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify the artifact as extracted on a clean tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy/verify-ubuntu-artifact.mjs "artifact-out/11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz" "${{ steps.build.outputs.sha }}"
          ( cd artifact-out && sha256sum -c "11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz.sha256" )

      - name: Rebuild is byte-identical (reproducible archive)
        shell: bash
        run: |
          set -euo pipefail
          first="$(cut -d' ' -f1 "artifact-out/11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz.sha256")"
          node scripts/deploy/build-ubuntu-artifact.mjs --out artifact-out-2 --sha "${{ steps.build.outputs.sha }}" --skip-build >/dev/null
          second="$(cut -d' ' -f1 "artifact-out-2/11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz.sha256")"
          echo "first=${first} second=${second}"
          test "${first}" = "${second}"

      - name: Publish checksum in the job summary
        shell: bash
        run: |
          echo "::notice title=Ubuntu artifact::sha=${{ steps.build.outputs.sha }} file=11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz sha256=$(cut -d' ' -f1 "artifact-out/11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz.sha256") bytes=$(stat -c %s "artifact-out/11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz")"
          {
            echo "### Ubuntu/VinaHost artifact"
            echo "- source SHA: \`${{ steps.build.outputs.sha }}\`"
            echo "- file: \`11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "artifact-out/11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64.tar.gz.sha256")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the archive and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: 11ship-${{ steps.build.outputs.sha }}-ubuntu24-amd64
          path: |
            artifact-out/*.tar.gz
            artifact-out/*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
  # M00-VPS-01 review F1/F3: the runbook's OS-level preparation on a REAL PostgreSQL 17 cluster of a disposable Ubuntu 24.04 runner:
  # the two OS users (root, postgres) with the real directory and file modes, peer authentication, TLS 1.3, SCRAM over TCP with the
  # passwords from the original files, the wrapper's refusals, and both certificate procedures (renew-leaf, CA rotation).
  selfhosted-os-prep:
    name: Self-hosted preparation on Ubuntu (M00-VPS-01)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 (PGDG) and make sure nothing else holds port 5432
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop postgresql || true
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          # The runner image ships a PostgreSQL 16 cluster definition and may not create a 17 cluster at install time: remove the
          # 16 one (disposable runner) and make a fresh 17/main on 5432, like the VPS's Ubuntu package default.
          sudo pg_dropcluster --stop 16 main || true
          pg_lsclusters | grep -q '^17 ' || sudo pg_createcluster 17 main --port 5432 --start
          sudo systemctl start postgresql@17-main || true
          pg_lsclusters

      - name: Runbook preparation, refusals, TCP/TLS/SCRAM login, certificate renewal and rotation
        id: osprep
        env:
          SELFHOSTED_OS_PREP_CONFIRM: disposable-ci-runner
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .test-results
          sudo -E bash tests/selfhosted/os-prep.sh 2>&1 | tee .test-results/os-prep.log

      - name: Annotate failure
        if: ${{ failure() && steps.osprep.conclusion == 'failure' }}
        run: node scripts/annotate-log.js "Self-hosted preparation on Ubuntu" .test-results/os-prep.log 60

      - name: Report counts
        if: ${{ always() && hashFiles('.test-results/os-prep.log') != '' }}
        shell: bash
        run: echo "::notice title=Self-hosted preparation on Ubuntu::$(grep -E '^os-prep:|NOT OK' .test-results/os-prep.log | tr '\n' ';')"

  # M00-L: the launcher is a Windows tool, so its behaviour suite also runs on real Windows with Windows
  # PowerShell 5.1 (the shell the .cmd wrappers call), including the cmd wrappers started the way a double-click
  # starts them. No database and no secrets: Docker and npm are faked inside the suite.
  launcher-windows:
    name: Launcher behaviour (Windows PowerShell 5.1)
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Needed only so the suite can check the generated TEST DATABASE_URL with the real PostgreSQL driver parser.
      - name: Install dependencies (npm ci)
        run: npm ci

      # M01.22: the test SMS inbox on real Windows: private state ACL (PowerShell), process start time, and the
      # real .cmd wrapper started the way a double-click starts it.
      - name: Build backend (for the test SMS inbox tool)
        shell: powershell
        run: npm run build

      - name: Test SMS inbox tool and private state on Windows
        id: testsms
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .test-results
          npm run test-sms:test 2>&1 | tee .test-results/test-sms.log

      - name: Annotate test SMS inbox tool failure (Windows)
        if: ${{ failure() && steps.testsms.conclusion == 'failure' }}
        run: node scripts/annotate-log.js "Test SMS inbox tool (Windows)" .test-results/test-sms.log 60

      - name: Report test SMS inbox tool counts (Windows)
        if: ${{ always() && hashFiles('.test-results/test-sms.log') != '' }}
        shell: bash
        run: echo "::notice title=Test SMS inbox tool (Windows)::$(grep -E 'ℹ (tests|suites|pass|fail|cancelled|skipped|todo)|✖|SKIP' .test-results/test-sms.log | tr '\n' ';')"

      - name: Launcher behaviour suite and Windows wrapper runs
        id: launcher
        shell: powershell
        run: npm run launcher:test

      - name: Annotate launcher test failure
        if: ${{ failure() && steps.launcher.conclusion == 'failure' }}
        run: node scripts/annotate-log.js "Launcher behaviour (Windows PowerShell 5.1)" .test-results/launcher-behaviour.log 60

      - name: Report launcher behaviour counts
        if: ${{ always() && hashFiles('.test-results/launcher-behaviour.log') != '' }}
        shell: bash
