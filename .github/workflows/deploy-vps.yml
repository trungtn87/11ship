name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: vps-production
      url: https://103.9.78.67.sslip.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve latest main once
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm install --global npm@11.9.0
          npm ci
      - name: Build and verify release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node scripts/deploy/build-ubuntu-artifact.mjs --out artifact-out --sha "$SOURCE_SHA"
          node scripts/deploy/verify-ubuntu-artifact.mjs "artifact-out/11ship-${SOURCE_SHA}-ubuntu24-amd64.tar.gz" "$SOURCE_SHA"
          (cd artifact-out && sha256sum -c "11ship-${SOURCE_SHA}-ubuntu24-amd64.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: vps-release-${{ steps.source.outputs.sha }}
          path: |
            artifact-out/*.tar.gz
            artifact-out/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Deploy over verified SSH
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy/github-vps-deploy.sh
      - name: Record checked deployment
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo '### VPS deployed and checked'
            echo "Source main SHA: \`$SOURCE_SHA\`"
            echo 'Target: https://103.9.78.67.sslip.io'
            echo 'Existing updater verified HTTPS/API/Admin/Android readiness; no device acceptance claimed.'
          } >> "$GITHUB_STEP_SUMMARY"
