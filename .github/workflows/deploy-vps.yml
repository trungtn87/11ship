name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      approve_reviewed_migrations:
        description: 'Import exact migration hashes reviewed in main (unknown or changed SQL still stops deploy)'
        type: boolean
        required: false
        default: true
      configure_cao_bang_gps:
        description: 'Approve reviewed M02 GPS coverage migrations for Cao Bang before deploy'
        type: boolean
        required: false
        default: false

      approve_m01_shop_code_migrations:
        description: 'Approve exact reviewed migrations from PRs #165 and #170 before deploy'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: vps-production-deploy
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI gate (deploy SHA must be green on main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve latest main once
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful CI on the exact deploy SHA (fail-closed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/deploy/ci-gate.mjs "$DEPLOY_SHA"

  deploy:
    needs: ci-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: vps-production
      url: https://103.9.78.67.sslip.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
      - name: Resolve latest main once
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm install --global npm@11.9.0
          npm ci
      - name: Validate reviewed migration hashes
        run: python3 -B scripts/deploy/vps-update.py validate-reviewed .
      - name: Build and verify release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node scripts/deploy/build-ubuntu-artifact.mjs --out artifact-out --sha "$SOURCE_SHA"
          node scripts/deploy/verify-ubuntu-artifact.mjs "artifact-out/11ship-${SOURCE_SHA}-ubuntu24-amd64.tar.gz" "$SOURCE_SHA"
          (cd artifact-out && sha256sum -c "11ship-${SOURCE_SHA}-ubuntu24-amd64.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: vps-release-${{ steps.source.outputs.sha }}
          path: |
            artifact-out/*.tar.gz
            artifact-out/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: APK compatibility preflight (blocks a breaking backend without a published, downloadable APK)
        run: |
          set -o pipefail
          ORIGIN=$(node -p "require('./config/endpoints.json').api_origin")
          echo '### APK–backend compatibility (before promote)' >> "$GITHUB_STEP_SUMMARY"
          node scripts/deploy/check-app-compat.mjs --live "$ORIGIN" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Approve the two reviewed Cao Bang GPS migrations
        if: ${{ inputs.configure_cao_bang_gps == true }}
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy/github-vps-approve-gps.sh
      - name: Approve reviewed M01 and shop-code migrations
        if: ${{ inputs.approve_m01_shop_code_migrations == true }}
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy/github-vps-approve-m01-shop-codes.sh
      - name: Report deploy start to M13 (needs OPS_DEPLOY_INGEST_TOKEN; never blocks the deploy)
        id: ops_start
        continue-on-error: true
        env:
          OPS_DEPLOY_INGEST_TOKEN: ${{ secrets.OPS_DEPLOY_INGEST_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [ -z "$OPS_DEPLOY_INGEST_TOKEN" ]; then
            echo '### M13 deploy report' >> "$GITHUB_STEP_SUMMARY"
            echo 'OPS_DEPLOY_INGEST_TOKEN is not configured for environment vps-production: this deploy is NOT recorded in Web Admin (Phiên bản & cập nhật). The deploy itself is unaffected.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export OPS_INGEST_TOKEN="$OPS_DEPLOY_INGEST_TOKEN"
          export OPS_INGEST_BASE="$(node -p "require('./config/endpoints.json').api_origin")/v1/ops/ingest"
          OUT=$(node scripts/ops-report.mjs deploy-start --component BACKEND --to "${SOURCE_SHA:0:12}" --note "main $SOURCE_SHA") || { echo '::warning::M13 deploy-start report was not delivered; the deploy continues.'; exit 0; }
          echo "$OUT"
          ID=$(printf '%s' "$OUT" | sed -n 's/.*deploy id \([0-9a-f-]\{36\}\).*/\1/p')
          if [ -n "$ID" ]; then echo "deploy_id=$ID" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy over verified SSH
        id: deploy
        env:
          APPROVE_REVIEWED_MIGRATIONS: ${{ inputs.approve_reviewed_migrations }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy/github-vps-deploy.sh
      - name: APK compatibility after deploy (production serves the contract; below-minimum phones get a download)
        run: |
          ORIGIN=$(node -p "require('./config/endpoints.json').api_origin")
          node scripts/deploy/check-app-compat.mjs --live "$ORIGIN" --after
      - name: Check GPS coverage was activated
        if: ${{ inputs.configure_cao_bang_gps == true }}
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from urllib.parse import urlencode
          url='https://103.9.78.67.sslip.io/v1/service-areas/resolve?' + urlencode({'latitude': '22.66667', 'longitude': '106.25833'})
          with urllib.request.urlopen(url, timeout=20) as result:
              payload=json.load(result)
          area=payload.get('data')
          if not isinstance(area, dict) or area.get('name') != 'Cao Bằng':
              raise SystemExit('M02 GPS verification failed: expected active Cao Bằng zone at centre (check actual VPS area row)')
          print('GPS area verified: Cao Bằng centre resolves successfully')
          PY
      - name: Record checked deployment
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo '### VPS deployed and checked'
            echo "Source main SHA: \`$SOURCE_SHA\`"
            echo 'Target: https://103.9.78.67.sslip.io'
            echo 'Existing updater verified HTTPS/API/Admin/Android readiness; no device acceptance claimed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report deploy result to M13 (always runs; never fails the job)
        if: ${{ always() && steps.ops_start.outputs.deploy_id != '' }}
        continue-on-error: true
        env:
          OPS_INGEST_TOKEN: ${{ secrets.OPS_DEPLOY_INGEST_TOKEN }}
          DEPLOY_ID: ${{ steps.ops_start.outputs.deploy_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          export OPS_INGEST_BASE="$(node -p "require('./config/endpoints.json').api_origin")/v1/ops/ingest"
          if [ "$JOB_STATUS" = success ]; then STATUS=SUCCEEDED; else STATUS=FAILED; fi
          if [ "$DEPLOY_OUTCOME" = success ]; then HEALTH=PASSED; else HEALTH=FAILED; fi
          node scripts/ops-report.mjs deploy-finish --id "$DEPLOY_ID" --status "$STATUS" --health "$HEALTH" --detail "updater health check $HEALTH" || echo '::warning::M13 deploy-finish report was not delivered.'
