name: M01 foundation · web and three APKs
on:
  pull_request:
    paths: ['apps/foundation/**', 'tests/foundation/**', '.github/workflows/m01-foundation.yml']
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'Public HTTPS API origin; empty builds an explicitly unconfigured shell'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/foundation/health.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: 11-admin-step1-web
          path: apps/foundation/web
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_ORIGIN: ${{ inputs.api_origin || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint all three APKs
        working-directory: apps/foundation/android
        run: gradle --no-daemon assembleCustomerDebug assembleShopDebug assembleDriverDebug lint -PapiOrigin="$API_ORIGIN"
      - uses: actions/upload-artifact@v4
        with:
          name: 11-three-apps-step1-apk
          path: apps/foundation/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
