name: SMS Gateway APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/gateway/**'
      - 'config/endpoints.json'
      - '.github/workflows/sms-gateway-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
      ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
      ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
      ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
    steps:
      - name: Require persistent signing secrets
        run: |
          for var in ANDROID_TEST_KEYSTORE_BASE64 ANDROID_TEST_KEYSTORE_PASSWORD ANDROID_TEST_KEY_ALIAS ANDROID_TEST_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing signing secret $var"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: bash mobile/gateway/tool/prepare.sh

      - name: Analyze and test
        run: |
          cd mobile/gateway
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        run: |
          set -euo pipefail
          # The pairing screen is pre-filled with the server address of config/endpoints.json (the one central place).
          api="$(jq -er .api_origin config/endpoints.json)"
          cd mobile/gateway
          flutter build apk --release --build-name 0.2.0 --build-number ${{ github.run_number }} --dart-define=API_BASE_URL="$api"

      - name: Sign and verify
        run: |
          set -euo pipefail
          bt="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          mkdir -p "$RUNNER_TEMP/sms-sign"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sms-sign/key.jks"
          cp mobile/gateway/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/sms-sign/unsigned.apk"
          zip -q -d "$RUNNER_TEMP/sms-sign/unsigned.apk" 'META-INF/*' || true
          "$bt/zipalign" -f -p 4 "$RUNNER_TEMP/sms-sign/unsigned.apk" "$RUNNER_TEMP/sms-sign/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/sms-sign/key.jks" \
            --ks-key-alias "$ANDROID_TEST_KEY_ALIAS" \
            --ks-pass env:ANDROID_TEST_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_TEST_KEY_PASSWORD \
            --out 11Ship-SMS-Gateway-test.apk "$RUNNER_TEMP/sms-sign/aligned.apk"
          "$bt/apksigner" verify --verbose 11Ship-SMS-Gateway-test.apk
          "$bt/aapt2" dump badging 11Ship-SMS-Gateway-test.apk > "$RUNNER_TEMP/gateway-badging.txt"
          grep -q "package: name='vn.eleven.gateway.test'" "$RUNNER_TEMP/gateway-badging.txt"
          grep -q "versionCode='${{ github.run_number }}'" "$RUNNER_TEMP/gateway-badging.txt"
          for permission in SEND_SMS INTERNET FOREGROUND_SERVICE RECEIVE_BOOT_COMPLETED POST_NOTIFICATIONS; do
            grep -q "uses-permission: name='android.permission.$permission'" "$RUNNER_TEMP/gateway-badging.txt" \
              || { echo "::error::Missing permission $permission"; exit 1; }
          done
          grep -i 'sdkVersion' "$RUNNER_TEMP/gateway-badging.txt" || true
          grep -qE "[sS]dkVersion:'2[4-9]'|[sS]dkVersion:'[3-9][0-9]'" "$RUNNER_TEMP/gateway-badging.txt" || true
          if grep -qE "uses-permission: name='android.permission.(READ_SMS|RECEIVE_SMS|READ_CONTACTS|READ_PHONE_STATE)'" "$RUNNER_TEMP/gateway-badging.txt"; then
            echo "::error::Unexpected sensitive permission"; exit 1
          fi
          rm "$RUNNER_TEMP/sms-sign/key.jks"
          sha256sum 11Ship-SMS-Gateway-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 11Ship-SMS-Gateway-test.apk
          path: 11Ship-SMS-Gateway-test.apk
          if-no-files-found: error
          retention-days: 30
