    module: M00
    title: Backend Foundation
    kind: leaf
    parent: null
    order: 10
    weight: 1
    owner_role: CLAUDE
    design_role: CHATGPT
    review_role: CHATGPT
    depends_on: []
    design_pr: 1
    implementation_pr: 2
    acceptance: docs/tasks/M00-B1-foundation.md
    evidence: docs/evidence/M00-B1.md

  - id: M00-C1
