  # Corrective work after the M00/M01 merges (session authorization inside onboarding transactions, bounded
  # rollback, effective active role, progress accuracy). PR #19 carries the design document AND the repair code,
  # so it is pinned as BOTH, with the explicit combined_design_implementation flag (see the field list above).
  - id: M01-R1
    module: M01
    title: Post-merge repairs (session, rollback, router, progress)
    kind: leaf
    parent: null
    order: 50
    weight: 1
    owner_role: CLAUDE
