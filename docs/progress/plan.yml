# 11Ship progress plan (manifest).
#
# This file describes the PLAN only: which tasks exist, who is responsible, what depends on what.
# It never records runtime status (DONE, CI green, ...). Status is derived by
# scripts/generate-progress.mjs from real GitHub objects (merged_at, state, draft, head SHA,
# check runs, labels) and written to docs/PROGRESS.md.
#
# YAML subset understood by scripts/progress/yaml-subset.mjs (anything else is a hard error):
#   2-space indentation, "key: value" maps, "- item" lists, "- key: value" list-of-maps,
#   scalars (null, true/false, integers, plain/quoted strings), "[]" / "[a, b]" flow lists,
#   and "#" comments. No anchors, multi-line scalars, tags or tabs.
#
# Task fields
#   id                    unique id; label "module:<id>" binds a PR to the task
#   module                module id (see modules)
#   title                 display title
#   kind                  "leaf" (counts for progress, has an implementation PR) or
#                         "group" (design gate + roll-up of its children)
#   parent                parent task id or null
#   order                 global display order (ascending)
#   weight                progress weight of a leaf (groups carry no weight); default 1
#   owner_role            who implements (CLAUDE) / owns the group
#   design_role           who designs (CHATGPT)
#   review_role           who reviews (CHATGPT)
#   depends_on            task ids that must be DONE first (a child also inherits its ancestors')
#   design_pr             pinned design PR number (history only; new PRs are matched by labels)
#   implementation_pr     pinned implementation PR number (history only)
#   requires_main_ci_green  extra gate: the latest main commit must have all required checks green
#   acceptance            path of the task / acceptance document
#   evidence              path of the evidence document
#
# Pinned PR numbers are the only way an unlabeled historical PR is accepted. Every other PR must
# carry explicit labels (agent:*, type:*, module:<task id>); GitHub usernames are never used.

schema_version: 1

project:
  id: 11ship
  name: 11Ship

repo: trungtn87/11ship
main_branch: main

# Check run names that must be "success" for CI to count as PASS. The repository is private on a
# plan without the branch-protection API, so the list lives here instead of being read from GitHub.
required_checks:
  - Verify (Node 24, PostgreSQL 17)

# false: the roadmap is not final, so overall progress is labelled "planned tasks only".
roadmap_complete: false

modules:
  - id: M00
    title: Foundation
    order: 1
  - id: M01
    title: Authentication
    order: 2

# PRs that must never count, whatever their state or labels. A closed-without-merge PR is already
# CANCELLED automatically; this list adds the human reason and also covers a reopened PR.
ignored_prs:
  - number: 5
    task: M00-C1A1
    reason: Implementation opened by ChatGPT against the workflow, closed without merge. Not accepted.

tasks:
