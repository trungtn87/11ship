  <text x="815" y="791" class="b small">SMS TEST — KHÔNG GỬI SMS TỚI ĐIỆN THOẠI</text>
  <text x="808" y="834" class="white mono">REGISTER / RESET_PASSWORD / ADMIN_ACTIVATION</text>
  <text x="808" y="866" class="white">1. Yêu cầu OTP trong app.</text>
  <text x="808" y="898" class="white">2. Double-click công cụ SMS test trên PC, chọn tin.</text>
  <text x="808" y="930" class="white">3. Lấy mã backend vừa tạo và tự nhập vào app.</text>
  <text x="808" y="970" class="white small">Loopback + token private · OTP/proof/TTL/rate thật · Không public OTP</text>
  <text x="808" y="998" class="white small">SMS vendor thật: M12.12 · Cuối dự án, trước phát hành production</text>
