name: v5_widgetbook
description: Standalone design sandbox for 11Food and 11Ship V5 UI. No live API or business flow.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Full upstream source pinned by the repo's Git submodule (v3.25.0).
  widgetbook:
    path: ../../third_party/widgetbook/packages/widgetbook
  n11_shared:
    path: ../packages/n11_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
