name: n11_m14_map
description: Offline Cao Bang map view and point picker (M14 map core only) shared by 11Ship and 11Food. No GPS, no foreground service, no routing.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: vn.eleven.m14.flutter.map
        pluginClass: M14MapPlugin
