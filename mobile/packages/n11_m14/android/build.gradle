group = 'vn.eleven.m14.flutter'
version = '0.1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
repositories { google(); mavenCentral() }
android {
    namespace = 'vn.eleven.m14.flutter'
    compileSdk = 35
    defaultConfig { minSdk = 26 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    // Compile the SAME Kotlin sources as the test application. History is deliberately excluded.
    def core = file('../../../gps-test')
    sourceSets.main {
        java.srcDirs += ['map', 'gps', 'routing'].collect { new File(core, "$it/src/main/java") }
        assets.srcDir new File(core, 'app/src/main/assets')
    }
}
dependencies {
    implementation 'org.maplibre.gl:android-sdk:11.8.0'
}
