group = 'vn.eleven.m14.flutter'
version = '0.1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
repositories { google(); mavenCentral() }
android {
    namespace = 'vn.eleven.m14.flutter'
    compileSdk = 35
    defaultConfig { minSdk = 26 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    // The recorder (gps) and the routing client of the SAME Kotlin sources as the GPS test app. History is deliberately excluded. The map sources and
    // the Cao Bang package come from the map-only plugin (n11_m14_map), so no class is compiled twice.
    def core = file('../../../gps-test')
    sourceSets.main {
        java.srcDirs += ['gps', 'routing'].collect { new File(core, "$it/src/main/java") }
    }
}
dependencies {
    implementation project(':n11_m14_map')
}
