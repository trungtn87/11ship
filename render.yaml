# Render Blueprint — 11Ship staging API (M00-D1).
#
# STATUS: configuration only. Nothing here has been deployed or validated by Render's own tooling. Deploying is a
# separate, controlled step after review (see ops/runbooks/render-supabase-staging.md); this service also cannot
# come up live until M00-D2 exists, because staging currently refuses to start without an OTP provider
# (bindOtpProvider rejects APP_ENV=staging). Do NOT set APP_ENV=development here to get around that.
#
# Authorized scope: ONE Render Free web service. No Render database, no worker, no cron job, no paid plan.
# The database is the separate Supabase project, reached through its SESSION pooler over TLS (runtime role only).
#
# Secrets use `sync: false`: Render asks for the value in the dashboard and the value never lives in this file.
# The MIGRATION credential is deliberately NOT here: the running service never holds it, and migrations never run
# from this service (not at build, not at start). Use `npm run db:migrate:remote` from a controlled machine.

services:
  - type: web
    name: 11ship-api-staging
    runtime: node
    plan: free
    # Closest Render region to the Supabase project (ap-northeast-1, Tokyo). Review before the first deploy: a
    # service's region cannot be changed afterwards.
    region: singapore

    # Pinned toolchain: Node from .node-version (24.21.0) via NODE_VERSION below, and npm 11.9.0 (packageManager)
    # through npx so no global install is needed. `--include=dev` is required because NODE_ENV=production would
    # otherwise skip the TypeScript compiler that `npm run build` needs. Migrations are NOT part of the build.
    buildCommand: npx --yes npm@11.9.0 ci --include=dev && npx --yes npm@11.9.0 run build
    startCommand: npm start

    # Readiness, not liveness: a deploy only counts as healthy when the database answers (200 with DB, 503 without).
    healthCheckPath: /v1/health/ready

    # No automatic deploys. A deploy is started by hand for one exact reviewed commit, after the migrations for that
    # commit have been applied and checked.
    autoDeployTrigger: "off"

    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render supplies PORT; the application reads it.
      # Small pool: the session pooler gives each client connection a dedicated server connection.
      - key: DB_POOL_MAX
        value: "2"
      # TLS handshake plus pooler authentication across regions needs more than the 1000 ms local default.
      - key: DB_CONNECT_TIMEOUT_MS
        value: "5000"

      # --- Secrets: values are entered in the Render dashboard, never committed. ---
      # Runtime-role URL of the Supabase SESSION pooler. No query string (the application refuses one).
      - key: DATABASE_URL
        sync: false
      # PEM of the Supabase CA the server certificate is verified against (public certificate, handled as a secret
      # setting so it can be rotated without a commit).
      - key: DB_SSL_CA
        sync: false
      - key: AUTH_OTP_HMAC_SECRET
        sync: false
      - key: CRYPTO_ACTIVE_KEY_ID
        sync: false
      - key: CRYPTO_KEYRING
        sync: false
