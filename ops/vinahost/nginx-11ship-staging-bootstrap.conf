# nginx site — 11Ship staging, HTTP-ONLY BOOTSTRAP (M00-VPS-01, gói B).
# Used once, to let certbot answer the HTTP-01 challenge for 103.9.78.67.sslip.io. After the certificate is issued, replace
# this file with nginx-11ship-staging.conf (same sites-enabled name) and reload. No application traffic is proxied here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 103.9.78.67.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/11ship-acme;
    }
    location / {
        return 404;
    }
}
