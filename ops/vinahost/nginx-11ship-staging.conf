# nginx site — 11Ship staging on 103.9.78.67.sslip.io (M00-VPS-01, gói B). FULL site, HTTPS.
# Install ONLY after the certificate exists (runbook, "HTTPS"): /etc/nginx/sites-available/11ship-staging.conf, symlink into
# sites-enabled, `nginx -t`, reload. Before that, use nginx-11ship-staging-bootstrap.conf. (Ubuntu 24.04 ships nginx 1.24, so
# HTTP/2 is enabled on the listen line, not with the newer "http2 on" directive.)

# P5-7d rate limits (PREPARED / NOT DEPLOYED). limit_req_zone is valid here because Ubuntu's nginx.conf includes sites-enabled inside http {}.
# Keyed on $binary_remote_addr: nginx is the edge, so this is the real client address whatever the backend trusts
# (ADMIN_AUTH_TRUSTED_PROXY_IPS). Rates mirror the backend's STATIC numbers where it has one (tracking 60/min, route-distances 120/min,
# admin login 10/min, account deletion 20 per 600 s). Where the backend has none, or its number is stored in the database (OTP
# ip_per_hour), the rate is a coarse backstop. The backend stays the authority. Runbook: ops/runbooks/nginx-trust-proxy-OD30-20261109.md, 3.3.
limit_req_zone $binary_remote_addr zone=ship11_tracking:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=ship11_route_dist:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=ship11_admin_login:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=ship11_client_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ship11_otp_send:10m     rate=10r/m;
limit_req_zone $binary_remote_addr zone=ship11_deletion:10m     rate=2r/m;

# Do not allow a request whose Host header is not ours to reach the application.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 103.9.78.67.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/11ship-acme;
    }
    # A 1 MiB shop logo is up to ~1.4 MiB in JSON. Scope the extra transport allowance to profile writes.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/103.9.78.67.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103.9.78.67.sslip.io/privkey.pem;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 103.9.78.67.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/103.9.78.67.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103.9.78.67.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:5m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 1m;
    # Over a limit_req zone: 429, the same status the backend uses for its own limits (default nginx status is 503).
    limit_req_status 429;

    # M02 dish pictures: the one route that carries a picture (JSON with a base64 picture, at most 2 MiB of image = about 2.8 MiB of text).
    # Other non-image routes keep the 1m limit above.
    location = /v1/shop/me/menu/images {
        client_max_body_size 3600k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # P5-7d limited routes. Each repeats the FULL proxy header set: a proxy_set_header inside a location replaces every inherited one,
    # so a limited route that dropped these lines would forward the client's own X-Forwarded-For (runbook 3.1, invariant N).
    # Burst + nodelay: requests inside the burst are served at once, requests beyond it get 429 instead of being queued.
    location ~ ^/v1/(public/tracking|track)/ {
        limit_req zone=ship11_tracking burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /v1/discovery/route-distances {
        limit_req zone=ship11_route_dist burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /v1/admin-auth/login {
        limit_req zone=ship11_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /v1/client-auth/login {
        limit_req zone=ship11_client_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # OTP SEND only (creating a challenge). The verify routes (.../{id}/verify) are not limited here: the backend caps wrong attempts.
    location ~ ^/v1/(auth/phone-verifications|account-recovery/(locked/)?otp|admin-recovery/otp)$ {
        limit_req zone=ship11_otp_send burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /v1/account-deletion/confirm {
        limit_req zone=ship11_deletion burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE, never append: the application believes exactly one X-Forwarded-For entry from a trusted proxy,
        # so a client-supplied header must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
