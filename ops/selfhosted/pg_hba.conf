# pg_hba.conf for the self-hosted staging PostgreSQL 17 (M00-VPS-01). Replaces /etc/postgresql/17/main/pg_hba.conf.
#
# One purpose: the staging service and the operator, on the same machine, over TLS with SCRAM. Nothing else gets in.
#   - local socket: only the OS user "postgres" acts as the database superuser (sudo -u postgres psql);
#   - TCP: only database ship11_staging, only the two project roles, only from loopback, only with TLS (hostssl) and
#     SCRAM-SHA-256 — no "trust", no "md5", no plaintext;
#   - every other TCP attempt (any other address, user, database, or no TLS) is rejected.
# Pair it with listen_addresses = 'localhost' (postgresql-ship11.conf) so the port is not reachable from the network at all.
# Contains no secret. Reload after editing:  sudo systemctl reload postgresql@17-main

# TYPE     DATABASE         USER             ADDRESS        METHOD
local      all              postgres                        peer
hostssl    ship11_staging   ship11_app       127.0.0.1/32   scram-sha-256
hostssl    ship11_staging   ship11_app       ::1/128        scram-sha-256
hostssl    ship11_staging   ship11_migrator  127.0.0.1/32   scram-sha-256
hostssl    ship11_staging   ship11_migrator  ::1/128        scram-sha-256
host       all              all              all            reject
