# /etc/postgresql/17/main/conf.d/ship11.conf — settings of the self-hosted staging PostgreSQL 17 (M00-VPS-01).
# Ubuntu's postgresql.conf includes conf.d/*.conf. Contains no secret; the private key stays in its own file.
#
# Network and TLS: loopback only, TLS mandatory for the project roles (pg_hba.conf has no plaintext rule), TLS 1.3 only.
# The certificate must name `localhost` (SAN): the backend and the operator tools connect to the host name localhost and
# verify the chain and the host name against the CA you generated (ops/selfhosted/make-pki.sh).
listen_addresses = 'localhost'
port = 5432
ssl = on
ssl_cert_file = '/etc/postgresql/17/main/tls/server.crt'
ssl_key_file = '/etc/postgresql/17/main/tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'

# Sized for the 1 vCPU / ~1 GB VinaHost VPS that also runs the service and nginx. Starting values, not a benchmark:
# measure RAM and connections on the machine before changing them (the service uses DB_POOL_MAX=2; the operator one).
max_connections = 20
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 32MB
