services:
  routing:
    image: ${M14_IMAGE_REF:-11ship-m14-routing:current}
    build:
      context: ../..
      dockerfile: ops/m14/Dockerfile
    # Gateway limits (server.py): the public test service keeps 20 per minute / 2 parallel; ops/m14/vps.sh raises them for the one backend client.
    environment:
      M14_RATE_PER_MIN: ${M14_RATE_PER_MIN:-20}
      M14_MAX_CONCURRENT: ${M14_MAX_CONCURRENT:-2}
    ports: ['127.0.0.1:18014:10000']
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
